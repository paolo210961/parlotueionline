<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b9f95"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><link rel="manifest" href="manifest.json"><link rel="icon" href="parlotueio-icon.svg"><title>ParloTU&amp;IO</title><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100dvh;overflow:hidden;font-family:Arial,sans-serif;background:#fff;color:#111}.app{height:calc(100dvh - 56px);display:flex;flex-direction:column}.side{position:relative;flex:1 1 50%;min-height:0;overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:12px 18px}.side.fr{order:1;background:#0b9f95;color:#fff;transform:rotate(180deg)}.side.it{order:2;background:#fff;color:#111}.side-name{font-size:18px;font-weight:900;letter-spacing:.5px;opacity:.9}.phrase{width:100%;flex:1;display:flex;align-items:center;justify-content:center;text-align:center;font-size:clamp(32px,8vw,70px);font-weight:800;line-height:1.08;word-break:break-word;white-space:pre-wrap;padding:10px}.side.fr .phrase{color:#fff}.side.it .phrase{color:#111}.tools{width:100%;display:flex;align-items:center;justify-content:center;gap:32px;padding:6px 0 8px}.mic{width:76px;height:76px;border:0;border-radius:50%;background:#0b9f95;color:#fff;font-size:36px;box-shadow:0 4px 0 #08766f,0 6px 16px #006b6444;cursor:pointer}.fr .mic{background:#fff;color:#0b9f95;box-shadow:0 4px 0 #b9d8d5,0 6px 16px #005e5844}.mic.active{background:#0879d1!important;color:#fff!important;animation:pulse 1s ease-in-out infinite}.clear{width:58px;height:58px;border:0;border-radius:50%;background:#eef0f2;color:#222;font-size:32px;cursor:pointer}.clear:hover{background:#d9dde1}.status{min-height:18px;font-size:13px;font-weight:700;text-align:center;opacity:.85}.fr .status{color:#fff}.it .status{color:#52606d}@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}.footer{height:56px;display:flex;align-items:center;justify-content:center;background:#fff;border-top:1px solid #dce2e8}.footer a{color:#0f1f3a;border:1px solid #0f1f3a;border-radius:8px;padding:6px 14px;text-decoration:none;font-weight:800}@media(min-width:700px){.app{max-width:680px;margin:auto;height:calc(100dvh - 56px)}.phrase{font-size:58px}}
</style></head><body><main class="app">
<section class="side fr"><div class="side-name">FRANÇAIS</div><div id="frText" class="phrase"></div><div id="frStatus" class="status"></div><div class="tools"><button id="frMic" class="mic" onclick="ascolta('fr')">🎙️</button><button class="clear" onclick="cancella('fr')">×</button></div></section>
<section class="side it"><div class="side-name">ITALIANO</div><div id="itText" class="phrase"></div><div id="itStatus" class="status"></div><div class="tools"><button id="itMic" class="mic" onclick="ascolta('it')">🎙️</button><button class="clear" onclick="cancella('it')">×</button></div></section>
</main><footer class="footer"><a href="https://paolo210961.github.io/parlotueionline/">ParloTU&amp;IO</a></footer><script>
var lock=null,labels={it:{code:'it-IT',target:'fr-FR',listen:'Ascolto...',doing:'Traduco...',done:'Traduzione completata.',bad:'Traduzione non disponibile.'},fr:{code:'fr-FR',target:'it-IT',listen:'Ecoute...',doing:'Traduction...',done:'Traduction terminee.',bad:'Traduction indisponible.'}};
function keepOn(){if(!('wakeLock'in navigator)||document.visibilityState!=='visible')return;if(lock&&!lock.released)return;navigator.wakeLock.request('screen').then(function(x){lock=x;x.addEventListener('release',function(){lock=null})}).catch(function(){})}document.addEventListener('visibilitychange',function(){if(document.visibilityState==='visible'){lock=null;keepOn()}});
function speak(t,l){if(!t||!window.speechSynthesis)return;window.speechSynthesis.cancel();var u=new SpeechSynthesisUtterance(t);u.lang=l;window.speechSynthesis.speak(u)}
function traduci(t,da,a){var pair=da+'|'+a,u='https://api.mymemory.translated.net/get?q='+encodeURIComponent(t)+'&langpair='+encodeURIComponent(pair);return fetch(u).then(function(r){return r.json()}).then(function(d){if(!d.responseData||!d.responseData.translatedText)throw Error();return d.responseData.translatedText}).catch(function(){return fetch('https://translate.googleapis.com/translate_a/single?client=gtx&sl='+da+'&tl='+a+'&dt=t&q='+encodeURIComponent(t)).then(function(r){return r.json()}).then(function(d){return(d[0]||[]).map(function(x){return x[0]||''}).join('')})})}
function ascolta(lato){keepOn();var R=window.SpeechRecognition||window.webkitSpeechRecognition;if(!R){document.getElementById(lato+'Status').textContent='Microfono non supportato';return}var cfg=labels[lato],other=lato==='it'?'fr':'it',mic=document.getElementById(lato+'Mic'),st=document.getElementById(lato+'Status'),r=new R(),got=false;r.lang=cfg.code;r.interimResults=false;mic.disabled=true;mic.classList.add('active');st.textContent=cfg.listen;function done(){mic.disabled=false;mic.classList.remove('active')}r.onresult=function(e){got=true;var text=e.results[0][0].transcript;document.getElementById(lato+'Text').textContent=text;st.textContent=cfg.doing;traduci(text,cfg.code.split('-')[0],cfg.target.split('-')[0]).then(function(v){document.getElementById(other+'Text').textContent=v;speak(v,cfg.target);st.textContent=cfg.done}).catch(function(){st.textContent=cfg.bad}).finally(done)};r.onerror=function(e){st.textContent=e.error;done()};r.onend=function(){if(!got)done()};r.start()}
function cancella(lato){document.getElementById(lato+'Text').textContent='';document.getElementById(lato+'Status').textContent=''}
if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js').catch(function(){});
</script></body></html>
