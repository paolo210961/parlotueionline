<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b9f95"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><link rel="manifest" href="manifest.json"><link rel="icon" href="parlotueio-icon.svg"><title>ParloTU&amp;IO</title><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100dvh;overflow:hidden;font-family:Arial,sans-serif;background:#fff;color:#111}.app{height:calc(100dvh - 56px);display:flex;flex-direction:column}.side{position:relative;flex:1 1 50%;min-height:0;overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:12px 18px}.side.fr{order:1;background:#0b9f95;color:#fff;transform:rotate(180deg)}.side.it{order:2;background:#fff;color:#111}.side-name{font-size:18px;font-weight:900;letter-spacing:.5px;opacity:.9}.phrase{width:100%;flex:1;display:flex;align-items:center;justify-content:center;text-align:center;font-size:clamp(32px,8vw,70px);font-weight:800;line-height:1.08;word-break:break-word;white-space:pre-wrap;padding:10px}.side.fr .phrase{color:#fff}.side.it .phrase{color:#111}.tools{position:relative;width:100%;min-height:103px;display:flex;align-items:center;justify-content:center;padding:6px 0 8px}.mic{width:103px;height:103px;border:0;border-radius:50%;background:#0b9f95;color:#fff;font-size:36px;box-shadow:0 4px 0 #08766f,0 6px 16px #006b6444;cursor:pointer}.fr .mic{background:#fff;color:#0b9f95;box-shadow:0 4px 0 #b9d8d5,0 6px 16px #005e5844}.mic.active{background:#0879d1!important;color:#fff!important;animation:pulse 1s ease-in-out infinite}.clear{position:absolute;right:0;width:41px;height:41px;border:0;border-radius:50%;background:#eef0f2;color:#222;font-size:22px;cursor:pointer}.clear:hover{background:#d9dde1}.status{min-height:18px;font-size:13px;font-weight:700;text-align:center;opacity:.85}.fr .status{color:#fff}.it .status{color:#52606d}@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}.footer{height:56px;display:flex;align-items:center;justify-content:center;background:#fff;border-top:1px solid #dce2e8}.footer a{color:#0f1f3a;border:1px solid #0f1f3a;border-radius:8px;padding:6px 14px;text-decoration:none;font-weight:800}@media(min-width:700px){.app{max-width:680px;margin:auto;height:calc(100dvh - 56px)}.phrase{font-size:58px}}
</style><style>.app{height:calc(100dvh - 94px)}.footer{height:94px;gap:5px;flex-direction:column}.footer-controls{display:flex;width:min(380px,95%);gap:8px;justify-content:center}.footer-controls button{flex:1;border:1px solid #075d9a;border-radius:11px;padding:8px 7px;background:#0879d1;color:#fff;font-size:14px;font-weight:900;cursor:pointer}.footer-controls button.active{background:#f4c542;color:#111;border-color:#a47d00}.beta-note{font-size:10px;line-height:1.1;color:#c62828;font-weight:900;text-align:center;padding:0 8px}.foto-mode{display:none;position:relative;width:100%;height:calc(100dvh - 94px);overflow:hidden;background:#06191b}.foto-mode.active{display:block}.foto-video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}.foto-status{position:absolute;top:8px;left:5%;right:5%;padding:5px;border-radius:8px;background:#0008;color:#fff;text-align:center;font-weight:700;font-size:12px}.foto-result{position:absolute;left:5%;right:5%;bottom:6%;min-height:70px;padding:14px 10px;border-radius:15px;background:rgba(255,255,255,.93);color:#101820;text-align:center;font-size:clamp(24px,7vw,42px);font-weight:900;line-height:1.15;white-space:pre-wrap;word-break:break-word;box-shadow:0 4px 18px #0005}@media(min-width:700px){.app{height:calc(100dvh - 94px)}.foto-mode{max-width:680px;margin:auto}}@media(max-width:390px){.footer-controls button{font-size:12px;padding:7px 4px}}</style></head><body><main id="voceMode" class="app">
<section class="side fr"><div class="side-name">FRANÇAIS</div><div id="frText" class="phrase"></div><div id="frStatus" class="status"></div><div class="tools"><button id="frMic" class="mic" onclick="ascolta('fr')">🎙️</button><button class="clear" onclick="cancella('fr')">×</button></div></section>
<section class="side it"><div class="side-name">ITALIANO</div><div id="itText" class="phrase"></div><div id="itStatus" class="status"></div><div class="tools"><button id="itMic" class="mic" onclick="ascolta('it')">🎙️</button><button class="clear" onclick="cancella('it')">×</button></div></section>
</main><main id="fotoMode" class="foto-mode"><video id="fotoVideo" class="foto-video" autoplay muted playsinline></video><div id="fotoStatus" class="foto-status">Inquadra un testo in italiano o francese</div><div id="fotoTestoTradotto" class="foto-result"></div></main><footer class="footer"><div class="footer-controls"><button id="voceTab" class="active" onclick="cambiaVista('voce')">🎙️ ParliTU&amp;IO</button><button id="fotoTab" onclick="cambiaVista('foto')">📷 FotoTraduci</button></div><div class="beta-note">App funzione beta, i risultati potrebbero contenere errori ed essere imprecisi</div></footer><script>
var lock=null,labels={it:{code:'it-IT',target:'fr-FR',listen:'Ascolto...',doing:'Traduco...',done:'Traduzione completata.',bad:'Traduzione non disponibile.'},fr:{code:'fr-FR',target:'it-IT',listen:'Ecoute...',doing:'Traduction...',done:'Traduction terminee.',bad:'Traduction indisponible.'}};
function keepOn(){if(!('wakeLock'in navigator)||document.visibilityState!=='visible')return;if(lock&&!lock.released)return;navigator.wakeLock.request('screen').then(function(x){lock=x;x.addEventListener('release',function(){lock=null})}).catch(function(){})}document.addEventListener('visibilitychange',function(){if(document.visibilityState==='visible'){lock=null;keepOn()}});
function speak(t,l){if(!t||!window.speechSynthesis)return;window.speechSynthesis.cancel();var u=new SpeechSynthesisUtterance(t);u.lang=l;window.speechSynthesis.speak(u)}
function traduci(t,da,a){var pair=da+'|'+a,u='https://api.mymemory.translated.net/get?q='+encodeURIComponent(t)+'&langpair='+encodeURIComponent(pair);return fetch(u).then(function(r){return r.json()}).then(function(d){if(!d.responseData||!d.responseData.translatedText)throw Error();return d.responseData.translatedText}).catch(function(){return fetch('https://translate.googleapis.com/translate_a/single?client=gtx&sl='+da+'&tl='+a+'&dt=t&q='+encodeURIComponent(t)).then(function(r){return r.json()}).then(function(d){return(d[0]||[]).map(function(x){return x[0]||''}).join('')})})}
function ascolta(lato){keepOn();var R=window.SpeechRecognition||window.webkitSpeechRecognition;if(!R){document.getElementById(lato+'Status').textContent='Microfono non supportato';return}var cfg=labels[lato],other=lato==='it'?'fr':'it',mic=document.getElementById(lato+'Mic'),st=document.getElementById(lato+'Status'),r=new R(),got=false;r.lang=cfg.code;r.interimResults=false;mic.disabled=true;mic.classList.add('active');st.textContent=cfg.listen;function done(){mic.disabled=false;mic.classList.remove('active')}r.onresult=function(e){got=true;var text=e.results[0][0].transcript;document.getElementById(lato+'Text').textContent=text;st.textContent=cfg.doing;traduci(text,cfg.code.split('-')[0],cfg.target.split('-')[0]).then(function(v){document.getElementById(other+'Text').textContent=v;speak(v,cfg.target);st.textContent=cfg.done}).catch(function(){st.textContent=cfg.bad}).finally(done)};r.onerror=function(e){st.textContent=e.error;done()};r.onend=function(){if(!got)done()};r.start()}
function cancellaVoce(l){document.getElementById(l+'Text').textContent='';document.getElementById(l+'Status').textContent=''}
var fotoStream=null,fotoWorker=null,fotoWorkerPromise=null,fotoLoop=false,fotoBusy=false,fotoCandidato='',fotoRipetizioni=0,fotoTradotto='';
function cambiaVista(v){var f=v==='foto';document.getElementById('voceMode').style.display=f?'none':'flex';document.getElementById('fotoMode').classList.toggle('active',f);document.getElementById('voceTab').classList.toggle('active',!f);document.getElementById('fotoTab').classList.toggle('active',f);if(f){keepOn();avviaFotoLive()}else{fermaFotoLive()}}
function fermaFotoLive(){fotoLoop=false;if(fotoStream){fotoStream.getTracks().forEach(function(t){t.stop()});fotoStream=null}document.getElementById('fotoVideo').srcObject=null;}
function avviaFotoLive(){var s=document.getElementById('fotoStatus');if(fotoStream)return;if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){s.textContent='Fotocamera non disponibile: apri l’app tramite HTTPS.';return}s.textContent='Avvio fotocamera...';navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}},audio:false}).then(function(stream){fotoStream=stream;var v=document.getElementById('fotoVideo');v.srcObject=stream;return v.play()}).then(function(){fotoLoop=true;fotoCandidato='';fotoRipetizioni=0;fotoTradotto='';cicloFoto()}).catch(function(){s.textContent='Consenti l’accesso alla fotocamera per usare FotoTraduci.'})}
function caricaOcr(){if(fotoWorker)return Promise.resolve(fotoWorker);if(fotoWorkerPromise)return fotoWorkerPromise;fotoWorkerPromise=(window.Tesseract?Promise.resolve():new Promise(function(resolve,reject){var s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js';s.onload=resolve;s.onerror=reject;document.head.appendChild(s)})).then(function(){return window.Tesseract.createWorker('ita+fra',1)}).then(function(w){fotoWorker=w;return w});return fotoWorkerPromise}
function traduciFoto(t){return fetch('https://translate.googleapis.com/translate_a/single?client=gtx&sl=auto&tl=fr&dt=t&q='+encodeURIComponent(t)).then(function(r){return r.json()}).then(function(d){var from=String(d[2]||'').toLowerCase(),fr=from==='fr'||from.indexOf('fr-')===0;if(fr)return traduci(t,'fr','it').then(function(x){return{text:x,lang:'it-IT'}});var x=(d[0]||[]).map(function(y){return y[0]||''}).join('');if(!x)throw Error();return{text:x,lang:'fr-FR'}}).catch(function(){return traduci(t,'it','fr').then(function(x){return{text:x,lang:'fr-FR'}})})}
function cicloFoto(){if(!fotoLoop||fotoBusy)return;var v=document.getElementById('fotoVideo');if(!v.videoWidth){setTimeout(cicloFoto,400);return}fotoBusy=true;caricaOcr().then(function(worker){var c=document.createElement('canvas'),w=Math.min(v.videoWidth,1000),h=Math.round(v.videoHeight*w/v.videoWidth);c.width=w;c.height=h;c.getContext('2d').drawImage(v,0,0,w,h);return worker.recognize(c)}).then(function(r){var t=(r.data.text||'').replace(/\s+/g,' ').trim();if(t.length>3){if(t===fotoCandidato)fotoRipetizioni++;else{fotoCandidato=t;fotoRipetizioni=1}if(fotoRipetizioni>=2&&t!==fotoTradotto){fotoTradotto=t;document.getElementById('fotoStatus').textContent='Testo riconosciuto e tradotto';return traduciFoto(t).then(function(x){if(fotoLoop){var out=document.getElementById('fotoTestoTradotto');out.textContent=x.text;speak(x.text,x.lang)}})}}}).catch(function(){document.getElementById('fotoStatus').textContent='Caricamento OCR o riconoscimento in corso...'}).finally(function(){fotoBusy=false;if(fotoLoop)setTimeout(cicloFoto,1300)})}
if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js').catch(function(){});
</script></body></html>
