*{box-sizing:border-box}html,body{margin:0;width:100%;height:100dvh;overflow:hidden;font-family:Arial,sans-serif;background:#fff;color:#111}.app{height:calc(100dvh - 56px);display:flex;flex-direction:column}.side{position:relative;flex:1 1 50%;min-height:0;overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:12px 18px}.side.fr{order:1;background:#0b9f95;color:#fff;transform:rotate(180deg)}.side.it{order:2;background:#fff;color:#111}.side-name{font-size:18px;font-weight:900;letter-spacing:.5px;opacity:.9}.phrase{width:100%;flex:1;display:flex;align-items:center;justify-content:center;text-align:center;font-size:clamp(32px,8vw,70px);font-weight:800;line-height:1.08;word-break:break-word;white-space:pre-wrap;padding:10px}.side.fr .phrase{color:#fff}.side.it .phrase{color:#111}.tools{position:relative;width:100%;min-height:103px;display:flex;align-items:center;justify-content:center;padding:6px 0 8px}.mic{width:103px;height:103px;border:0;border-radius:50%;background:#0b9f95;color:#fff;font-size:36px;box-shadow:0 4px 0 #08766f,0 6px 16px #006b6444;cursor:pointer}.fr .mic{background:#fff;color:#0b9f95;box-shadow:0 4px 0 #b9d8d5,0 6px 16px #005e5844}.mic.active{background:#0879d1!important;color:#fff!important;animation:pulse 1s ease-in-out infinite}.clear{position:absolute;right:0;width:41px;height:41px;border:0;border-radius:50%;background:#eef0f2;color:#222;font-size:22px;cursor:pointer}.clear:hover{background:#d9dde1}.status{min-height:18px;font-size:13px;font-weight:700;text-align:center;opacity:.85}.fr .status{color:#fff}.it .status{color:#52606d}@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}.footer{height:56px;display:flex;align-items:center;justify-content:center;background:#fff;border-top:1px solid #dce2e8}.footer a{color:#0f1f3a;border:1px solid #0f1f3a;border-radius:8px;padding:6px 14px;text-decoration:none;font-weight:800}@media(min-width:700px){.app{max-width:680px;margin:auto;hei </style><style>.app{height:calc(100dvh - 94px)}.footer{height:94px;gap:5px;flex-direction:column}.footer-controls{display:flex;width:min(380px,95%);gap:8px;justify-content:center}.footer-controls button{flex:1;border:1px solid #075d9a;border-radius:11px;padding:8px 7px;background:#0879d1;color:#fff;font-size:14px;font-weight:900;cursor:pointer}.footer-controls button.active{background:#f4c542;color:#111;border-color:#a47d00}.beta-note{font-size:10px;line-height:1.1;color:#c62828;font-weight:900;text-align:center;padding:0 8px}.foto-mode{display:none;position:relative;width:100%;height:calc(100dvh - 94px);overflow:hidden;background:#06191b}.foto-mode.active{display:block}.foto-video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}.foto-status{position:absolute;top:8px;left:5%;right:5%;padding:5px;border-radius:8px;background:#0008;color:#fff;text-align:center;font-weight:700;font-size:12px}.foto-result{position:absolute;left:5%;right:5%;bottom:6%;min-height:70px;padding:14px 10px;border-radius:15px;background:rgba(255,255,255,.93);color:#101820;text-align:center;font-size:clamp(24px,7vw,42px);font-weight:900;line-height:1.15;white-space:pre-wrap;word-break:break-word;box-shadow:0 4px 18px #0005}@media(min-width:700px){.app{height:calc(100dvh - 94px)}.foto-mode{max-width:680px;margin:auto}}@media(max-width:390px){.footer-controls button{font-size:12px;padding:7px 4px}}</style></head><body><main id="voceMode" class="app">

</main><main id="fotoMode" class="foto-mode"><style>.scan-frame{position:absolute;z-index:3;left:8%;top:19%;width:84%;height:58%;border:2px solid #fff;border-radius:3px;box-shadow:0 0 0 9999px #0005;touch-action:none;cursor:move}.scan-frame:before,.scan-frame:after{content:'';position:absolute;pointer-events:none}.scan-frame:before{inset:33.333% 0;border-top:1px solid #ffffff99;border-bottom:1px solid #ffffff99}.scan-frame:after{inset:0 33.333%;border-left:1px solid #ffffff99;border-right:1px solid #ffffff99}.scan-handle{position:absolute;z-index:2;width:18px;height:18px;border:2px solid #fff;border-radius:50%;background:#0b9f95;touch-action:none}.scan-handle[data-h="nw"]{left:-9px;top:-9px}.scan-handle[data-h="n"]{left:calc(50% - 9px);top:-9px}.scan-handle[data-h="ne"]{right:-9px;top:-9px}.scan-handle[data-h="e"]{right:-9px;top:calc(50% - 9px)}.scan-handle[data-h="se"]{right:-9px;bottom:-9px}.scan-handle[data-h="s"]{left:calc(50% - 9px);bottom:-9px}.scan-handle[data-h="sw"]{left:-9px;bottom:-9px}.scan-handle[data-h="w"]{left:-9px;top:calc(50% - 9px)}.foto-status{z-index:6}.foto-translate-btn{position:absolute;z-index:7;bottom:10px;left:50%;transform:translateX(-50%);width:min(220px,62%);border:0;border-radius:24px;padding:13px;background:#0b9f95;color:#fff;font-size:19px;font-weight:900;box-shadow:0 4px 0 #08766f;cursor:pointer}.foto-result{z-index:5}</style><video id="fotoVideo" class="foto-video" autoplay muted playsinline></video><div id="fotoStatus" class="foto-status">Inquadra il testo nella cornice e premi Traduci</div><div id="scanFrame" class="scan-frame"><i class="scan-handle" data-h="nw"></i><i class="scan-handle" data-h="n"></i><i class="scan-handle" data-h="ne"></i><i class="scan-handle" data-h="e"></i><i class="scan-handle" data-h="se"></i><i class="scan-handle" data-h="s"></i><i class="scan-handle" data-h="sw"></i><i class="scan-handle" data-h="w"></i></div><div id="fotoTestoTradotto" class="foto-result" style="display:none"></div><button class="foto-translate-btn" onclick="event.stopPropagation();scansionaFotoSubito()">Traduci</button></main><footer class="footer"><div class="footer-controls"><button id="voceTab" class="active" onclick="cambiaVista('voce')">🎙️ ParliTU&amp;IO</button><button id="fotoTab" onclick="cambiaVista('foto')">📷 FotoTraduci</button></div><div class="beta-note">App funzione beta, i risultati potrebbero contenere errori ed essere imprecisi</div></footer><script>
var lock=null,labels={it:{code:'it-IT',target:'fr-FR',listen:'Ascolto...',doing:'Traduco...',done:'Traduzione completata.',bad:'Traduzione non disponibile.'},fr:{code:'fr-FR',target:'it-IT',listen:'Ecoute...',doing:'Traduction...',done:'Traduction terminee.',bad:'Traduction indisponible.'}};
function keepOn(){if(!('wakeLock'in navigator)||document.visibilityState!=='visible')return;if(lock&&!lock.released)return;navigator.wakeLock.request('screen').then(function(x){lock=x;x.addEventListener('release',function(){lock=null})}).catch(function(){})}document.addEventListener('visibilitychange',function(){if(document.visibilityState==='visible'){lock=null;keepOn()}});

function traduci(t,da,a){var pair=da+'|'+a,u='https://api.mymemory.translated.net/get?q='+encodeURIComponent(t)+'&langpair='+encodeURIComponent(pair);return fetch(u).then(function(r){return r.json()}).then(function(d){if(!d.responseData||!d.responseData.translatedText)throw Error();return d.responseData.translatedText}).catch(function(){return fetch('https://translate.googleapis.com/translate_a/single?client=gtx&sl='+da+'&tl='+a+'&dt=t&q='+encodeURIComponent(t)).then(function(r){return r.json()}).then(function(d){return(d[0]||[]).map(function(x){return x[0]||''}).join('')})})}
function ascolta(lato){keepOn();var R=window.SpeechRecognition||window.webkitSpeechRecognition;if(!R){document.getElementById(lato+'Status').textContent='Microfono non supportato';return}var cfg=labels[lato],other=lato==='it'?'fr':'it',mic=document.getElementById(lato+'Mic'),st=document.getElementById(lato+'Status'),r=new R(),got=false;r.lang=cfg.code;r.interimResults=false;mic.disabled=true;mic.classList.add('active');st.textContent=cfg.listen;function done(){mic.disabled=false;mic.classList.remove('active')}r.onresult=function(e){got=true;var text=e.results[0][0].transcript;document.getElementById(lato+'Text').textContent=text;st.textContent=cfg.doing;traduci(text,cfg.code.split('-')[0],cfg.target.split('-')[0]).then(function(v){document.getElementById(other+'Text').textContent=v;speak(v,cfg.target);st.textContent=cfg.done}).catch(function(){st.textContent=cfg.bad}).finally(done)};r.onerror=function(e){st.textContent=e.error;done()};r.onend=function(){if(!got)done()};r.start()}
function cancellaVoce(l){document.getElementById(l+'Text').textContent='';document.getElementById(l+'Status').textContent=''}
var fotoStream=null,fotoWorker=null,fotoWorkerPromise=null,fotoLoop=false,fotoBusy=false,fotoForce=false,fotoCandidato='',fotoRipetizioni=0,fotoTradotto='',fotoOutput='',fotoOutputLang='fr-FR';
var scanDrag=null,scanFrameReady=false;
function inizializzaCornice(){if(scanFrameReady)return;scanFrameReady=true;var frame=document.getElementById('scanFrame'),parent=document.getElementById('fotoMode');function pointerDown(e){e.preventDefault();e.stopPropagation();var r=parent.getBoundingClientRect(),h=e.target.getAttribute('data-h')||'move';scanDrag={mode:h,x:e.clientX,y:e.clientY,left:frame.offsetLeft/r.width,top:frame.offsetTop/r.height,width:frame.offsetWidth/r.width,height:frame.offsetHeight/r.height,pw:r.width,ph:r.height};frame.setPointerCapture(e.pointerId)}function pointerMove(e){if(!scanDrag)return;e.preventDefault();var dx=(e.clientX-scanDrag.x)/scanDrag.pw,dy=(e.clientY-scanDrag.y)/scanDrag.ph,d=scanDrag,l=d.left,t=d.top,w=d.width,h=d.height,m=d.mode,minW=.28,minH=.16;if(m==='move'){l=Math.max(0,Math.min(1-w,d.left+dx));t=Math.max(.04,Math.min(.92-h,d.top+dy))}else{if(m.indexOf('w')>=0){var nr=Math.max(0,Math.min(d.left+d.width-minW,d.left+dx));w=d.left+d.width-nr;l=nr}else if(m.indexOf('e')>=0){w=Math.max(minW,Math.min(1-d.left,d.width+dx))}if(m.indexOf('n')>=0){var nt=Math.max(.04,Math.min(d.top+d.height-minH,d.top+dy));h=d.top+d.height-nt;t=nt}else if(m.indexOf('s')>=0){h=Math.max(minH,Math.min(.92-d.top,d.height+dy))}}frame.style.left=(l*100)+'%';frame.style.top=(t*100)+'%';frame.style.width=(w*100)+'%';frame.style.height=(h*100)+'%'}function pointerUp(){scanDrag=null}frame.addEventListener('pointerdown',pointerDown);frame.addEventListener('pointermove',pointerMove);frame.addEventListener('pointerup',pointerUp);frame.addEventListener('pointercancel',pointerUp)}
function cambiaVista(v){var f=v==='foto';document.getElementById('voceMode').style.display=f?'none':'flex';document.getElementById('fotoMode').classList.toggle('active',f);document.getElementById('voceTab').classList.toggle('active',!f);document.getElementById('fotoTab').classList.toggle('active',f);if(f){keepOn();inizializzaCornice();avviaFotoLive()}else{fermaFotoLive()}}
function fermaFotoLive(){fotoLoop=false;if(fotoStream){fotoStream.getTracks().forEach(function(t){t.stop()});fotoStream=null}document.getElementById('fotoVideo').srcObject=null;}
function scansionaFotoSubito(){if(!fotoStream){avviaFotoLive();return}if(!fotoLoop){document.getElementById('fotoStatus').textContent='Attendi l’avvio della fotocamera...';return}if(fotoBusy){document.getElementById('fotoStatus').textContent='Scansione già in corso...';return}fotoCandidato='';fotoRipetizioni=0;fotoTradotto='';fotoOutput='';var out=document.getElementById('fotoTestoTradotto');out.textContent='';out.style.display='none';document.getElementById('fotoStatus').textContent='Leggo e traduco l’area selezionata...';cicloFoto()}
function avviaFotoLive(){var s=document.getElementById('fotoStatus'),out=document.getElementById('fotoTestoTradotto');if(fotoStream)return;inizializzaCornice();out.textContent='';out.style.display='none';fotoOutput='';if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){s.textContent='Fotocamera non disponibile: apri l’app tramite HTTPS.';return}s.textContent='Avvio fotocamera...';navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}},audio:false}).then(function(stream){fotoStream=stream;var v=document.getElementById('fotoVideo');v.srcObject=stream;return v.play()}).then(function(){fotoLoop=true;fotoCandidato='';fotoRipetizioni=0;fotoTradotto='';s.textContent='Inquadra il testo nella cornice e premi Traduci'}).catch(function(){s.textContent='Consenti l’accesso alla fotocamera per usare FotoTraduci.'})}
function caricaOcr(){if(fotoWorker)return Promise.resolve(fotoWorker);if(fotoWorkerPromise)return fotoWorkerPromise;fotoWorkerPromise=(window.Tesseract?Promise.resolve():new Promise(function(resolve,reject){var s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js';s.onload=resolve;s.onerror=reject;document.head.appendChild(s)})).then(function(){return window.Tesseract.createWorker('fra',1)}).then(function(w){fotoWorker=w;return w.setParameters({tessedit_pageseg_mode:'6',preserve_interword_spaces:'1'}).then(function(){return w})});return fotoWorkerPromise}
function traduciFoto(t){return traduci(t,'fr','it').then(function(x){return{text:x,lang:'it-IT'}})}
function testoOcrPulito(data){var text=(data.text||'').replace(/\s+/g,' ').trim(),ls=(data.lines||[]).filter(function(l){return (l.text||'').trim().length>1&&Number(l.confidence)>=25&&l.bbox});if(!ls.length)return{text:text,bbox:null};var box={x0:Math.min.apply(null,ls.map(function(x){return x.bbox.x0})),y0:Math.min.apply(null,ls.map(function(x){return x.bbox.y0})),x1:Math.max.apply(null,ls.map(function(x){return x.bbox.x1})),y1:Math.max.apply(null,ls.map(function(x){return x.bbox.y1}))};return{text:text,bbox:box}}
function areaCornice(video){var stage=document.getElementById('fotoMode'),frame=document.getElementById('scanFrame'),sr=stage.getBoundingClientRect(),fr=frame.getBoundingClientRect(),cover=Math.max(sr.width/video.videoWidth,sr.height/video.videoHeight),cropX=(video.videoWidth*cover-sr.width)/2,cropY=(video.videoHeight*cover-sr.height)/2;var sx=Math.max(0,Math.min(video.videoWidth,(fr.left-sr.left+cropX)/cover)),sy=Math.max(0,Math.min(video.videoHeight,(fr.top-sr.top+cropY)/cover)),sw=Math.min(video.videoWidth-sx,fr.width/cover),sh=Math.min(video.videoHeight-sy,fr.height/cover);return{sx:sx,sy:sy,sw:sw,sh:sh,stageRect:sr,cropScreen:{left:fr.left-sr.left,top:fr.top-sr.top,width:fr.width,height:fr.height},cover:cover,cropX:cropX,cropY:cropY,videoW:video.videoWidth,videoH:video.videoHeight}}
function posizionaTraduzione(box,geom){var out=document.getElementById('fotoTestoTradotto'),sr=geom.stageRect,vw=sr.width,vh=sr.height,sx=geom.sx,sy=geom.sy,sw=geom.sw,sh=geom.sh,cx=sx+sw/2,cy=sy+sh/2,srcW=sw;if(box){cx=sx+(box.x0+box.x1)/2*sw/geom.canvasW;cy=sy+(box.y0+box.y1)/2*sh/geom.canvasH;srcW=(box.x1-box.x0)*sw/geom.canvasW;}var px=cx*geom.cover-geom.cropX,py=cy*geom.cover-geom.cropY,roi=geom.cropScreen,width=Math.min(roi.width-10,Math.max(220,srcW*geom.cover*1.55));px=Math.max(roi.left+width/2+5,Math.min(roi.left+roi.width-width/2-5,px));py=Math.max(roi.top+30,Math.min(roi.top+roi.height-30,py));var chars=Math.max(1,(out.textContent||'').length),font=Math.max(16,Math.min(28,(width-20)*1.25/Math.min(chars,24)));out.style.left=(px/vw*100)+'%';out.style.top=(py/vh*100)+'%';out.style.right='auto';out.style.bottom='auto';out.style.width=width+'px';out.style.minHeight='0';out.style.height='auto';out.style.maxHeight=Math.max(50,roi.height-10)+'px';out.style.overflowY='auto';out.style.padding='8px 10px';out.style.border='2px solid #263238';out.style.borderRadius='7px';out.style.background='#fff';out.style.opacity='1';out.style.color='#111';out.style.fontSize=font+'px';out.style.lineHeight='1.12';out.style.boxShadow='0 2px 8px #0005';out.style.transform='translate(-50%,-50%)';out.style.display='block';}
function cicloFoto(){if(!fotoLoop||fotoBusy)return;var v=document.getElementById('fotoVideo');if(!v.videoWidth){document.getElementById('fotoStatus').textContent='Attendi l’avvio della fotocamera';return}fotoBusy=true;fotoForce=false;var geom=areaCornice(v);caricaOcr().then(function(worker){var c=document.createElement('canvas'),w=Math.min(geom.sw,1000),h=Math.round(geom.sh*w/geom.sw);c.width=w;c.height=h;c.getContext('2d').drawImage(v,geom.sx,geom.sy,geom.sw,geom.sh,0,0,w,h);geom.canvasW=w;geom.canvasH=h;return worker.recognize(c).then(function(r){return{data:r.data,geom:geom}})}).then(function(r){var rec=testoOcrPulito(r.data),t=rec.text;if(t.length>3){fotoTradotto=t;document.getElementById('fotoStatus').textContent='Testo riconosciuto; traduco...';return traduciFoto(t).then(function(x){if(fotoLoop){fotoOutput=x.text;fotoOutputLang=x.lang;var out=document.getElementById('fotoTestoTradotto');out.textContent=x.text;posizionaTraduzione(rec.bbox,r.geom);speak(x.text,x.lang);document.getElementById('fotoStatus').textContent='Traduzione sovrapposta al testo inquadrato'}})}document.getElementById('fotoStatus').textContent='Nessun testo leggibile nella cornice: spostala o ridimensionala.';}).catch(function(){document.getElementById('fotoStatus').textContent='Scansione o traduzione non riuscita. Riprova.'}).finally(function(){fotoBusy=false})}
