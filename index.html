<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b9f95"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><link rel="manifest" href="manifest.json"><link rel="icon" href="parlotueio-icon.svg"><title>ParloTU&amp;IO</title><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100dvh;overflow:hidden;font-family:Arial,sans-serif;background:#fff;color:#111}.modebar{height:52px;flex:0 0 52px;display:grid;grid-template-columns:1.45fr 1fr 1fr .65fr;gap:5px;align-items:center;padding:5px 7px;background:#0879d1}.mode-tab{height:40px;border:1px solid #064a82;border-radius:9px;background:#f4c542;color:#111;font-size:12px;font-weight:900;cursor:pointer;padding:2px}.mode-tab.active{background:#fff;border:2px solid #063b87;color:#075c9d}.mode-tab.version{background:#0b9f95;color:#fff;border-color:#fff;cursor:default}.stage{height:calc(100dvh - 108px);min-height:0}.mode-view{display:none;width:100%;height:100%;min-height:0}.mode-view.active{display:flex}.app{height:100%;width:100%;display:flex;flex-direction:column}.side{position:relative;flex:1 1 50%;min-height:0;overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:9px 15px}.side.fr{order:1;background:#0b9f95;color:#fff;transform:rotate(180deg)}.side.it{order:2;background:#fff;color:#111}.side-name{font-size:16px;font-weight:900;letter-spacing:.5px}.phrase{width:100%;flex:1;display:flex;align-items:center;justify-content:center;text-align:center;font-size:clamp(30px,7vw,62px);font-weight:800;line-height:1.08;word-break:break-word;white-space:pre-wrap;padding:8px}.tools{position:relative;width:100%;min-height:88px;display:flex;align-items:center;justify-content:center;padding:5px 0}.mic{width:88px;height:88px;border:0;border-radius:50%;background:#0b9f95;color:#fff;font-size:34px;box-shadow:0 4px 0 #08766f,0 6px 16px #006b6444;cursor:pointer}.fr .mic{background:#fff;color:#0b9f95;box-shadow:0 4px 0 #b9d8d5,0 6px 16px #005e5844}.mic.active{background:#0879d1!important;color:#fff!important;animation:pulse 1s ease-in-out infinite}.clear{position:absolute;right:0;width:42px;height:42px;border:0;border-radius:50%;background:#eef0f2;color:#222;font-size:23px;cursor:pointer}.status{min-height:18px;font-size:12px;font-weight:700;text-align:center;opacity:.9}.fr .status{color:#fff}.it .status{color:#52606d}@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}.footer{height:56px;display:flex;align-items:center;justify-content:center;background:#fff;border-top:1px solid #dce2e8}.footer span{color:#0f1f3a;border:1px solid #0f1f3a;border-radius:8px;padding:6px 14px;font-weight:800}.work-view{overflow:auto;background:linear-gradient(145deg,#e7f5ff,#fff9df);padding:14px;display:none;flex-direction:column;align-items:center}.work-view.active{display:flex}.work-card{width:100%;max-width:620px;background:rgba(255,255,255,.95);border:2px solid #0f1f3a;border-radius:16px;padding:16px;box-shadow:0 6px 18px #0f1f3a22}.work-card h1{font-size:23px;text-align:center;margin:2px 0 14px;color:#0f1f3a}.work-card textarea{width:100%;min-height:25vh;border:2px solid #b9c9d8;border-radius:12px;padding:13px;font:20px/1.35 Arial,sans-serif;resize:vertical}.work-result{margin-top:12px;min-height:14vh;border:2px solid #b9c9d8;border-radius:12px;padding:13px;background:#fff;color:#111;font-size:21px;font-weight:800;white-space:pre-wrap;word-break:break-word}.work-actions{display:flex;gap:10px;margin-top:12px}.work-btn{flex:1;border:0;border-radius:15px;padding:13px 10px;background:#f4c542;color:#111;font-size:16px;font-weight:900;box-shadow:0 4px 0 #a47d00;cursor:pointer}.work-btn.blue{background:#0879d1;color:#fff;box-shadow:0 4px 0 #063b87}.work-status{min-height:24px;text-align:center;margin:9px 0;font-weight:800;color:#52606d}.image-input{display:block;width:100%;padding:12px;border:2px dashed #0879d1;border-radius:12px;background:#f2f9ff}.photo-preview{display:none;max-width:100%;max-height:28vh;object-fit:contain;margin:12px auto;border-radius:10px}.photo-preview.visible{display:block}@media(min-width:700px){.app{max-width:680px;margin:auto}.work-card{margin:auto}.phrase{font-size:58px}}@media(max-width:390px){.modebar{gap:3px;padding:4px}.mode-tab{font-size:10px}.mode-tab.version{font-size:9px}.mic{width:76px;height:76px}.tools{min-height:78px}}
</style></head><body>
<nav class="modebar" aria-label="Modalità"><button id="tabParli" class="mode-tab active" onclick="mostraModo('parli')">🎙️ ParliTU&amp;IO</button><button id="tabTraduci" class="mode-tab" onclick="mostraModo('traduci')">Traduci</button><button id="tabImmagine" class="mode-tab" onclick="mostraModo('immagine')">Immagine</button><button class="mode-tab version" type="button">v.101</button></nav>
<div class="stage">
<section id="modoParli" class="mode-view active"><main class="app">
<section class="side fr"><div class="side-name">FRANÇAIS</div><div id="frText" class="phrase"></div><div id="frStatus" class="status"></div><div class="tools"><button id="frMic" class="mic" onclick="ascolta('fr')">🎙️</button><button class="clear" onclick="cancellaVoce('fr')">×</button></div></section>
<section class="side it"><div class="side-name">ITALIANO</div><div id="itText" class="phrase"></div><div id="itStatus" class="status"></div><div class="tools"><button id="itMic" class="mic" onclick="ascolta('it')">🎙️</button><button class="clear" onclick="cancellaVoce('it')">×</button></div></section>
</main></section>
<section id="modoTraduci" class="mode-view work-view"><div class="work-card"><h1>✍️ Scrivi in italiano</h1><textarea id="testoDaTradurre" placeholder="Scrivi qui la frase in italiano..."></textarea><div class="work-actions"><button class="work-btn blue" onclick="traduciTestoManuale()">🔄 TRADUCI IN FRANCESE</button><button class="work-btn" onclick="cancellaTestoManuale()">× CANCELLA</button></div><div id="statoTraduci" class="work-status"></div><div id="risultatoTraduzione" class="work-result"></div></div></section>
<section id="modoImmagine" class="mode-view work-view"><div class="work-card"><h1>📷 Inquadra il testo da tradurre</h1><input id="fotoTesto" class="image-input" type="file" accept="image/*" capture="environment" onchange="anteprimaFoto(this)"><img id="anteprimaFoto" class="photo-preview" alt="Anteprima foto"><div class="work-actions"><button class="work-btn blue" onclick="scansionaTraduci()">📖 LEGGI E TRADUCI</button><button class="work-btn" onclick="cancellaFoto()">× CANCELLA</button></div><div id="statoImmagine" class="work-status"></div><div id="testoRiconosciuto" class="work-result"></div><div id="testoImmagineTradotto" class="work-result"></div><button class="work-btn" style="margin-top:10px;width:100%" onclick="leggiTestoImmagine()">🔊 ASCOLTA LA TRADUZIONE</button></div></section>
</div><footer class="footer"><span>ParliTU&amp;IO</span></footer><script>
var lock=null,labels={it:{code:'it-IT',target:'fr-FR',listen:'Ascolto...',doing:'Traduco...',done:'Traduzione completata.',bad:'Traduzione non disponibile.'},fr:{code:'fr-FR',target:'it-IT',listen:'Écoute...',doing:'Traduction...',done:'Traduction terminée.',bad:'Traduction indisponible.'}};
function keepOn(){if(!('wakeLock'in navigator)||document.visibilityState!=='visible')return;if(lock&&!lock.released)return;navigator.wakeLock.request('screen').then(function(x){lock=x;x.addEventListener('release',function(){lock=null})}).catch(function(){})}document.addEventListener('visibilitychange',function(){if(document.visibilityState==='visible'){lock=null;keepOn()}});
function mostraModo(m){['parli','traduci','immagine'].forEach(function(x){document.getElementById('modo'+x.charAt(0).toUpperCase()+x.slice(1)).classList.toggle('active',x===m);document.getElementById('tab'+x.charAt(0).toUpperCase()+x.slice(1)).classList.toggle('active',x===m)});}
function speak(t,l){if(!t||!window.speechSynthesis)return;window.speechSynthesis.cancel();var u=new SpeechSynthesisUtterance(t);u.lang=l;window.speechSynthesis.speak(u)}
function traduci(t,da,a){var pair=da+'|'+a,u='https://api.mymemory.translated.net/get?q='+encodeURIComponent(t)+'&langpair='+encodeURIComponent(pair);return fetch(u).then(function(r){return r.json()}).then(function(d){if(!d.responseData||!d.responseData.translatedText)throw Error();return d.responseData.translatedText}).catch(function(){return fetch('https://translate.googleapis.com/translate_a/single?client=gtx&sl='+da+'&tl='+a+'&dt=t&q='+encodeURIComponent(t)).then(function(r){return r.json()}).then(function(d){return(d[0]||[]).map(function(x){return x[0]||''}).join('')})})}
function traduciFotoAuto(t){return fetch('https://translate.googleapis.com/translate_a/single?client=gtx&sl=auto&tl=fr&dt=t&q='+encodeURIComponent(t)).then(function(r){return r.json()}).then(function(d){var detected=String(d[2]||'').toLowerCase(),fr=(detected==='fr'||detected.indexOf('fr-')===0);if(fr)return traduci(t,'fr','it').then(function(v){return{text:v,target:'it-IT'}});var v=(d[0]||[]).map(function(x){return x[0]||''}).join('');if(!v)throw Error();return{text:v,target:'fr-FR'}}).catch(function(){return traduci(t,'it','fr').then(function(v){return{text:v,target:'fr-FR'}})})}
function ascolta(lato){keepOn();var R=window.SpeechRecognition||window.webkitSpeechRecognition;if(!R){document.getElementById(lato+'Status').textContent='Microfono non supportato';return}var cfg=labels[lato],other=lato==='it'?'fr':'it',mic=document.getElementById(lato+'Mic'),st=document.getElementById(lato+'Status'),r=new R(),got=false;r.lang=cfg.code;r.interimResults=false;mic.disabled=true;mic.classList.add('active');st.textContent=cfg.listen;function done(){mic.disabled=false;mic.classList.remove('active')}r.onresult=function(e){got=true;var text=e.results[0][0].transcript;document.getElementById(lato+'Text').textContent=text;st.textContent=cfg.doing;traduci(text,cfg.code.split('-')[0],cfg.target.split('-')[0]).then(function(v){document.getElementById(other+'Text').textContent=v;speak(v,cfg.target);st.textContent=cfg.done}).catch(function(){st.textContent=cfg.bad}).finally(done)};r.onerror=function(e){st.textContent=e.error;done()};r.onend=function(){if(!got)done()};r.start()}
function cancellaVoce(l){document.getElementById(l+'Text').textContent='';document.getElementById(l+'Status').textContent=''}
function traduciTestoManuale(){var t=document.getElementById('testoDaTradurre').value.trim(),s=document.getElementById('statoTraduci'),o=document.getElementById('risultatoTraduzione');if(!t){s.textContent='Scrivi prima una frase.';return}s.textContent='Traduzione in corso...';o.textContent='';traduci(t,'it','fr').then(function(v){o.textContent=v;s.textContent='Traduzione completata.'}).catch(function(){s.textContent='Traduzione non disponibile.'})}
function cancellaTestoManuale(){document.getElementById('testoDaTradurre').value='';document.getElementById('risultatoTraduzione').textContent='';document.getElementById('statoTraduci').textContent=''}function leggiTraduzione(){speak(document.getElementById('risultatoTraduzione').textContent,'fr-FR')}
function anteprimaFoto(i){var f=i.files&&i.files[0],img=document.getElementById('anteprimaFoto');if(!f)return;img.src=URL.createObjectURL(f);img.classList.add('visible');document.getElementById('statoImmagine').textContent='Foto pronta per la scansione.';document.getElementById('testoRiconosciuto').textContent='';document.getElementById('testoImmagineTradotto').textContent=''}function cancellaFoto(){document.getElementById('fotoTesto').value='';document.getElementById('anteprimaFoto').removeAttribute('src');document.getElementById('anteprimaFoto').classList.remove('visible');document.getElementById('testoRiconosciuto').textContent='';document.getElementById('testoImmagineTradotto').textContent='';document.getElementById('statoImmagine').textContent=''}
function scansionaTraduci(){var f=document.getElementById('fotoTesto').files[0],s=document.getElementById('statoImmagine');if(!f){s.textContent='Scatta o scegli prima una foto.';return}s.textContent='Carico il lettore OCR...';function run(){s.textContent='Leggo il testo nella foto...';Tesseract.recognize(f,'ita+fra',{logger:function(m){if(m.status==='recognizing text')s.textContent='Riconoscimento testo: '+Math.round(m.progress*100)+'%'}}).then(function(res){var text=(res.data.text||'').trim();document.getElementById('testoRiconosciuto').textContent=text||'Nessun testo riconosciuto.';if(!text){s.textContent='Prova a scattare la foto più nitida e ravvicinata.';return}s.textContent='Rilevo la lingua e traduco...';traduciFotoAuto(text).then(function(out){document.getElementById('testoImmagineTradotto').textContent=out.text;document.getElementById('testoImmagineTradotto').dataset.lang=out.target;s.textContent=out.target==='it-IT'?'Tradotto in italiano.':'Tradotto in francese.'}).catch(function(){s.textContent='Testo letto, ma traduzione non disponibile.'})}).catch(function(){s.textContent='Scansione non riuscita. Riprova con una foto più nitida.'})}if(window.Tesseract){run();return}var sc=document.createElement('script');sc.src='https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js';sc.onload=run;sc.onerror=function(){s.textContent='Non riesco a caricare il motore di lettura. Controlla la connessione.'};document.head.appendChild(sc)}function leggiTestoImmagine(){var e=document.getElementById('testoImmagineTradotto');speak(e.textContent,e.dataset.lang||'fr-FR')}
if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js').catch(function(){});
</script></body></html>
